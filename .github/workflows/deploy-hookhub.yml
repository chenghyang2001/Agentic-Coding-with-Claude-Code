# HookHub VPS 自動部署 Workflow
# 觸發條件：push 到 main，且改動 Chapter02/hookhub/ 底下的任何檔案
# 透過 appleboy/ssh-action 連線 VPS 執行完整部署流程

name: Deploy HookHub to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'Chapter02/hookhub/**'
      - '.github/workflows/deploy-hookhub.yml'
  # 手動補跑入口：排隊中的部署被 concurrency 取消時，用 gh workflow run deploy-hookhub.yml 補跑
  workflow_dispatch:

# 同一時間只允許一個 deploy workflow 對 VPS 操作，防止並發競爭造成 PM2 狀態混亂
# 同一 group 最多 1 個執行中 + 1 個排隊中；第三個進來時，原本排隊的會被取消（cancelled）
# cancel-in-progress: false 只保證「執行中的不被中斷」，不保證每次 push 都部署
# 被取消時用 workflow_dispatch 手動補跑（gh workflow run deploy-hookhub.yml）
concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH Deploy to VPS
    runs-on: ubuntu-latest
    # 避免 ssh-action 卡住時佔用 vps-deploy group 長達預設 360 分鐘
    timeout-minutes: 20

    steps:
      - name: 部署 HookHub 到 VPS
        uses: appleboy/ssh-action@v1.0.3
        # 固定版本 v1.0.3 而非 @master，防止上游破壞性更新造成部署靜默失敗
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # 不設 fingerprint：私鑰認證已足夠安全，跳過 host key 比對
          # 逾時設 15 分鐘：npm ci + build 在低規 VPS 實測可達 8-10 分鐘，10m 邊際不足
          command_timeout: 15m
          script: |
            set -euo pipefail

            # ── Step 1：首次 clone，後續 pull ─────────────────────────────
            # 用 .git 目錄判斷是否已 clone，避免重複初始化
            # fetch + reset --hard：VPS 以 repo 為準，丟棄 VPS 本地對追蹤檔的修改
            # 舊的 --ff-only 在本地有修改的追蹤檔，或未追蹤檔會被新 commit 的同名檔覆蓋時會 abort
            REPO_DIR="$HOME/Agentic-Coding-with-Claude-Code"
            if [ -d "$REPO_DIR/.git" ]; then
              echo "📦 Repo 已存在，執行 git fetch + reset..."
              # 拆成獨立三行：&& 串列中非最後一個指令失敗時不觸發 set -e，fetch 失敗會用舊 commit 建置且 CI 綠燈
              cd "$REPO_DIR"
              git fetch origin main
              git reset --hard FETCH_HEAD
            else
              echo "🆕 首次部署，執行 git clone..."
              git clone https://github.com/chenghyang2001/Agentic-Coding-with-Claude-Code.git "$REPO_DIR"
            fi

            # ── Step 2：確保 PM2 已安裝（idempotent）─────────────────────
            # 設定 npm 全域安裝到 user home（避免 EACCES: /usr/lib/node_modules 需要 root）
            # npm config set prefix 讓後續 npm install -g 寫入 ~/.npm-global
            export NPM_GLOBAL="$HOME/.npm-global"
            mkdir -p "$NPM_GLOBAL"
            npm config set prefix "$NPM_GLOBAL"
            export PATH="$NPM_GLOBAL/bin:$PATH"
            # pm2 已存在就跳過，避免每次部署重新安裝
            command -v pm2 || npm install -g pm2

            # ── Step 3：安裝依賴並建置 Next.js ─────────────────────────────
            # npm ci 保證 lock file 一致性；build 產生 .next 目錄
            cd "$REPO_DIR/Chapter02/hookhub/hookhub"
            mkdir -p logs
            npm ci
            npm run build
            [ -d ".next" ] || { echo "❌ BUILD FAILED: .next directory missing"; exit 1; }

            # ── Step 4：PM2 啟動或重啟（idempotent）─────────────────────
            # 若 PM2 清單中已有 hookhub 就 reload（zero-downtime）
            # 首次啟動後執行 pm2 save 保存程序清單，重開機後自動恢復
            # pm2 describe 精確查詢 app 是否存在（exit 1 = 不存在），取代 grep 字串比對
            # 舊作法 `pm2 list | grep -q "hookhub"` 是子字串比對，會誤命中 hookhub-ch10 / hookhub-v2
            if pm2 describe hookhub > /dev/null 2>&1; then
              echo "♻️  HookHub 已在 PM2 中，執行 reload..."
              pm2 reload ecosystem.config.js --env production
              pm2 save --force
            else
              echo "🚀 首次啟動 HookHub..."
              pm2 start ecosystem.config.js --env production
              pm2 save --force
            fi

            # ── Step 5：Health check（含 retry）─────────────────────────
            # 等 5 秒讓 Next.js 完成啟動後再檢查
            # --retry-connrefused 讓 curl 在連線被拒時也重試（而非立即失敗）
            echo "⏳ 等待服務啟動..."
            sleep 5
            curl -f http://localhost:3001 \
              --retry 5 \
              --retry-delay 3 \
              --retry-connrefused \
              --silent \
              --show-error
            echo "✅ HookHub deployed successfully"
